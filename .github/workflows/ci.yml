# Typecheck and the unit suite on Linux and macOS. No secrets are used.
# The end-to-end suite (tests/e2e) needs a real Claude Code and cloudflared, so it runs on a developer machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep pandoc poppler-utils bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the file parsers run under bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep pandoc poppler

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests/unit
