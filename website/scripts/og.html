<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Social card template (1200x630). scripts/og.ts fills the text through the query string and screenshots it. -->
<style>
  @font-face { font-family: "Geist"; src: url("../src/assets/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("../src/assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Pretendard"; src: url("../src/assets/fonts/Pretendard-ko-core.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Geist", "Pretendard", sans-serif; color: #14110f; background: #fcfbf8;
    -webkit-font-smoothing: antialiased;
  }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 0% 0%, rgba(255, 91, 31, 0.20), transparent 70%),
      radial-gradient(ellipse 40% 50% at 100% 100%, rgba(255, 170, 90, 0.20), transparent 70%),
      linear-gradient(rgba(20, 17, 15, 0.05) 1px, transparent 1px) 0 0 / 64px 64px,
      linear-gradient(90deg, rgba(20, 17, 15, 0.05) 1px, transparent 1px) 0 0 / 64px 64px; }
  /* the site's key visual (Higgsfield, public/img): threads from the company folder to everyone's AI, on the right */
  .kv { position: absolute; right: -150px; bottom: -10px; width: 1020px; height: auto;
    -webkit-mask-image: radial-gradient(ellipse 50% 62% at 56% 70%, #000 38%, transparent 80%); mask-image: radial-gradient(ellipse 50% 62% at 56% 70%, #000 38%, transparent 80%); }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; }
  .brand svg { width: 44px; height: 44px; }
  h1 { position: absolute; left: 72px; top: 178px; width: 1060px; font-size: 84px; line-height: 1.06; letter-spacing: -0.045em; font-weight: 600; }
  body.ko h1 { font-size: 78px; line-height: 1.18; letter-spacing: -0.035em; font-weight: 700; }
  h1 span { display: block; background: linear-gradient(100deg, #b8380a 0%, #de470f 60%, #f0561a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 0.08em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; align-items: center; justify-content: space-between; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; border: 1px solid #d8d0c3; background: #fff; font-size: 24px; font-weight: 500; color: #514b45; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: #c43d0a; }
  .url { font-family: "Geist Mono", monospace; font-size: 24px; color: #6b645d; }
</style>
</head>
<body>
<div class="bg"></div>
<img class="kv" src="../public/img/hero-light-2400.webp" alt="" />
<div class="brand">
  <svg viewBox="0 0 32 32"><defs><mask id="m" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48"><rect x="-8" y="-8" width="48" height="48" fill="#fff"/><path d="M16 19.028L11.497 13.85L2.528 11.25L11.497 8.65L16 3.472L20.503 8.65L29.472 11.25L20.503 13.85Z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/><path d="M16 19.028L16 29.528" stroke="#000" stroke-width="1.65"/></mask></defs><g fill="#14110f" stroke="#14110f" stroke-width="0.25" stroke-linejoin="round" mask="url(#m)"><path d="M29.472 11.25L20.503 13.85L20.503 23.35L29.472 20.75Z"/><path d="M11.497 13.85L2.528 11.25L2.528 20.75L11.497 23.35Z"/><path d="M16 19.028L11.497 13.85L11.497 23.35L16 28.528Z"/><path d="M20.503 13.85L16 19.028L16 28.528L20.503 23.35Z"/></g><path d="M16 19.028L11.497 13.85L2.528 11.25L11.497 8.65L16 3.472L20.503 8.65L29.472 11.25L20.503 13.85Z" fill="#ff5b1f"/></svg>
  <b id="brand"></b>
</div>
<h1><b id="t1" style="font-weight:inherit"></b><span id="t2"></span></h1>
<div class="foot"><span class="chip"><i></i><b id="chip" style="font-weight:inherit"></b></span><span class="url">ax.trina.app</span></div>
<script>
  const q = new URLSearchParams(location.search)
  if (q.get('lang') === 'ko') document.body.classList.add('ko')
  for (const id of ['brand', 't1', 't2', 'chip']) document.getElementById(id).textContent = q.get(id) || ''
</script>
</body>
</html>
